{% if user.is_authenticated %}
<!-- Modal de advertencia de cierre de sesion por inactividad -->
<div id="sessionTimeoutModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[9999] hidden items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full mx-4 p-6 text-center transform transition-all scale-95 opacity-0" id="sessionTimeoutCard">
        <div class="w-14 h-14 rounded-full bg-amber-100 flex items-center justify-center mx-auto mb-4">
            <svg class="w-7 h-7 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <h3 class="text-lg font-bold text-gray-900 mb-2">Sesion por expirar</h3>
        <p class="text-sm text-gray-600 mb-6">Hemos detectado inactividad, su sesion esta por cerrar.</p>
        <div class="flex gap-3">
            <button id="extendSessionBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl transition-colors text-sm">
                Extender sesion
            </button>
            <a href="{% url 'logout' %}" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 px-4 rounded-xl transition-colors text-sm inline-flex items-center justify-center">
                Cerrar sesion
            </a>
        </div>
        <p class="text-xs text-gray-400 mt-4">Se cerrara automaticamente en <span id="countdownText" class="font-mono font-bold text-amber-600">60</span> segundos</p>
    </div>
</div>

<script>
(function() {
    const SESSION_AGE_MS = 15 * 60 * 1000;
    const WARNING_MS = 14 * 60 * 1000;
    let lastActivity = Date.now();
    let warningTimer = null;
    let logoutTimer = null;
    let countdownInterval = null;
    const modal = document.getElementById('sessionTimeoutModal');
    const card = document.getElementById('sessionTimeoutCard');
    const countdownText = document.getElementById('countdownText');
    const extendBtn = document.getElementById('extendSessionBtn');

    function resetTimers() {
        lastActivity = Date.now();
        clearTimeout(warningTimer);
        clearTimeout(logoutTimer);
        clearInterval(countdownInterval);
        hideModal();
        warningTimer = setTimeout(showWarning, WARNING_MS);
        logoutTimer = setTimeout(autoLogout, SESSION_AGE_MS);
    }

    function showWarning() {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        setTimeout(() => {
            card.classList.remove('scale-95', 'opacity-0');
            card.classList.add('scale-100', 'opacity-100');
        }, 10);
        let remaining = 60;
        countdownText.textContent = remaining;
        countdownInterval = setInterval(() => {
            remaining--;
            countdownText.textContent = remaining;
            if (remaining <= 0) clearInterval(countdownInterval);
        }, 1000);
    }

    function hideModal() {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        card.classList.add('scale-95', 'opacity-0');
        card.classList.remove('scale-100', 'opacity-100');
    }

    function autoLogout() {
        window.location.href = '{% url "logout" %}';
    }

    function extendSession() {
        fetch('{% url "session_keep_alive" %}')
            .then(() => resetTimers())
            .catch(() => resetTimers());
    }

    const events = ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'];
    events.forEach(evt => document.addEventListener(evt, resetTimers, { passive: true }));

    if (extendBtn) extendBtn.addEventListener('click', extendSession);

    resetTimers();
})();
</script>
{% endif %}
