{% load i18n %}
<script>
(function(){
    var h=new Date();
    var el=document.getElementById('currentDate');
    if(el){
        var fmt=new Intl.DateTimeFormat(document.documentElement.lang||'es',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
        el.textContent=fmt.format(h);
    }
})();

let currentAction=null, currentRowId=null;

function openModal(action,id){
    currentAction=action; currentRowId=id;
    var modal=document.getElementById('modal'+capitalize(action));
    if(modal) modal.classList.add('active');
    document.body.style.overflow='hidden';
}
function closeModal(action){
    var modal=document.getElementById('modal'+capitalize(action));
    if(modal) modal.classList.remove('active');
    document.body.style.overflow='';
    currentAction=null; currentRowId=null;
}
function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function getCsrfToken(){
    var name='csrftoken';
    var cookies=document.cookie.split(';');
    for(var i=0;i<cookies.length;i++){
        var c=cookies[i].trim();
        if(c.indexOf(name+'=')===0) return c.substring(name.length+1);
    }
    return '';
}

function submitForm(url, fields){
    var form=document.createElement('form');
    form.method='POST';
    form.action=url;
    form.style.display='none';
    var csrf=document.createElement('input');
    csrf.type='hidden';
    csrf.name='csrfmiddlewaretoken';
    csrf.value=getCsrfToken();
    form.appendChild(csrf);
    for(var key in fields){
        var inp=document.createElement('input');
        inp.type='hidden';
        inp.name=key;
        inp.value=fields[key];
        form.appendChild(inp);
    }
    document.body.appendChild(form);
    form.submit();
}

function confirmAction(action){
    var row=document.querySelector('tr[data-row-id="'+currentRowId+'"]');
    var request=document.querySelector('div[data-request-id="'+currentRowId+'"]');
    var target=row||request;
    if(action==='confirmar'){
        var url=target?target.getAttribute('data-confirm-url'):null;
        if(url){submitForm(url,{});}
        else{showToast('{% trans "Cita confirmada correctamente" %}','success'); closeModal(action);}
    } else if(action==='rechazar'){
        var url=target?target.getAttribute('data-reject-url'):null;
        var reason=document.getElementById('rejectReason');
        var fields={};
        if(reason&&reason.value.trim()) fields['motivo']=reason.value.trim();
        if(url){submitForm(url,fields);}
        else{showToast('{% trans "Cita rechazada correctamente" %}','error'); closeModal(action);}
    } else if(action==='cancelar'){
        var url=target?target.getAttribute('data-cancel-url'):null;
        if(url){submitForm(url,{'motivo_cancelacion':'{% trans "Cancelada por recepcionista/gerente" %}'});}
        else{showToast('{% trans "Cita cancelada correctamente" %}','error'); closeModal(action);}
    } else if(action==='llego'){
        var url=target?target.getAttribute('data-llego-url'):null;
        if(url){submitForm(url,{});}
        else{showToast('{% trans "Paciente marcado como atendido" %}','success'); closeModal(action);}
    }
}

function showToast(message,type){
    var container=document.getElementById('toastContainer');
    if(!container) return;
    var toast=document.createElement('div');
    toast.className='toast toast-'+type;
    var icon=type==='success'
        ?'<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
        :'<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
    toast.innerHTML=icon+'<span class="text-sm font-medium" style="color:var(--text-primary);">'+message+'</span>';
    container.appendChild(toast);
    requestAnimationFrame(function(){toast.classList.add('show');});
    setTimeout(function(){toast.classList.remove('show');setTimeout(function(){toast.remove();},400);},3000);
}

function toggleSidebar(){
    var sidebar=document.getElementById('sidebar');
    var overlay=document.getElementById('sidebarOverlay');
    if(sidebar) sidebar.classList.toggle('open');
    if(overlay) overlay.classList.toggle('active');
}

function toggleUpcoming(){
    var list=document.getElementById('upcomingList');
    var chevron=document.getElementById('upcomingChevron');
    if(list){list.classList.toggle('hidden');}
    if(chevron){chevron.style.transform=list.classList.contains('hidden')?'rotate(0deg)':'rotate(180deg)';}
}

function searchDashboard(query){
    var q=(query||'').toLowerCase().trim();

    // 1) Filtrar tabla de citas del día
    var tableBody=document.getElementById('dailyAppointmentsBody');
    if(tableBody){
        var rows=tableBody.querySelectorAll('tr[data-row-id]');
        var visibleRows=0;
        rows.forEach(function(row){
            var text=row.innerText.toLowerCase();
            if(text.indexOf(q)!==-1){
                row.style.display='';
                visibleRows++;
            } else {
                row.style.display='none';
            }
        });
        // Mostrar / ocultar mensaje "No hay citas"
        var emptyMsg=tableBody.querySelector('tr:not([data-row-id])');
        if(emptyMsg){
            emptyMsg.style.display=visibleRows===0?'':'none';
        }
    }

    // 2) Filtrar solicitudes pendientes
    var pendingList=document.getElementById('pendingRequestsList');
    if(pendingList){
        var items=pendingList.querySelectorAll('div[data-request-id]');
        var visibleItems=0;
        items.forEach(function(item){
            var text=item.innerText.toLowerCase();
            if(text.indexOf(q)!==-1){
                item.style.display='';
                visibleItems++;
            } else {
                item.style.display='none';
            }
        });
        // Mostrar / ocultar mensaje "No hay solicitudes"
        var emptyMsg=pendingList.querySelector('div:not([data-request-id])');
        if(emptyMsg){
            emptyMsg.style.display=visibleItems===0?'':'none';
        }
    }
}
</script>
