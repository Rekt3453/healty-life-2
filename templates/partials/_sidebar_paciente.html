{% load i18n %}
{% with current=request.resolver_match.url_name %}
<aside id="sidebar" class="dashboard-sidebar">
    <div class="p-6">
        <a href="{% url 'home' %}" class="flex items-center gap-3 text-xl font-bold" style="color:#1E293B;">
            <svg class="w-8 h-8" style="color:#0070F3;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            <span>Healthy Life</span>
        </a>
    </div>
    <nav class="flex-1 px-2 space-y-1" aria-label="{% trans 'Navegación del paciente' %}">
        <a href="{% url 'dashboard_paciente' %}" class="sidebar-nav-link {% if current == 'dashboard_paciente' %}active{% endif %}">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            <span>{% trans "Mi Dashboard" %}</span>
        </a>
        <a href="{% url 'mis_citas' %}" class="sidebar-nav-link {% if current == 'mis_citas' %}active{% endif %}">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span>{% trans "Mis Citas" %}</span>
        </a>
        <a href="{% url 'perfil_paciente' %}" class="sidebar-nav-link {% if current == 'perfil_paciente' %}active{% endif %}">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span>{% trans "Mi Perfil" %}</span>
        </a>
        <a href="{% url 'historial_medico' %}" class="sidebar-nav-link {% if current == 'historial_medico' %}active{% endif %}">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <span>{% trans "Historial Médico" %}</span>
        </a>
        <a href="{% url 'mis_facturas' %}" class="sidebar-nav-link {% if current == 'mis_facturas' %}active{% endif %}">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z"/></svg>
            <span>{% trans "Mis Facturas" %}</span>
        </a>
        <a href="{% url 'lista_pacientes_especiales' %}" class="sidebar-nav-link {% if current == 'lista_pacientes_especiales' or current == 'historial_medico_menor' %}active{% endif %}">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span>{% trans "Menores a Cargo" %}</span>
        </a>
    </nav>
    <div class="p-4 border-t" style="border-color:rgba(0,0,0,0.06);">
        <a href="{% url 'logout' %}" class="sidebar-nav-link" style="color:#EF4444;">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            <span>{% trans "Cerrar Sesión" %}</span>
        </a>
    </div>
</aside>
{% endwith %}
