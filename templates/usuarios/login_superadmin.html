{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Super Admin - Healthy Life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero-section { background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%); min-height: 100vh; }
        .login-card { backdrop-filter: blur(10px); background: rgba(255,255,255,0.97); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
        .form-input { transition: all 0.3s ease; border: 2px solid #e5e7eb; }
        .form-input:focus { border-color: #2E7D32; box-shadow: 0 0 0 3px rgba(46,125,50,0.15); outline: none; }
        .btn-dark { background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%); transition: all 0.3s ease; }
        .btn-dark:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(27,94,32,0.5); }
        .icon-wrapper { background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%); width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 2rem; }
        .shape { position:absolute; border-radius:50%; background:rgba(255,255,255,0.08); animation:float 6s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-20px) rotate(180deg);} }
    </style>
</head>
<body>
<div class="hero-section relative">
    <div style="position:absolute;width:100%;height:100%;overflow:hidden;z-index:0">
        <div class="shape" style="width:100px;height:100px;left:8%;animation-delay:0s;top:10%"></div>
        <div class="shape" style="width:150px;height:150px;right:10%;animation-delay:2s;top:20%"></div>
        <div class="shape" style="width:70px;height:70px;left:65%;animation-delay:4s;top:60%"></div>
    </div>

    <header class="relative z-10">
        <nav class="container mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3z"/>
                    </svg>
                    <span class="text-2xl font-bold text-white">Healthy Life</span>
                </div>
                <a href="{% url 'home' %}" class="text-white hover:text-green-100 transition-colors flex items-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    <span>Volver al inicio</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="relative z-10 container mx-auto px-4 py-12">
        <div class="max-w-md mx-auto">
            <div class="login-card rounded-2xl p-8">
                <div class="text-center mb-8">
                    <div class="icon-wrapper">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">Acceso Super Admin</h1>
                    <p class="text-gray-500 text-sm">Panel de gestión de centros médicos</p>
                </div>

                {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for message in messages %}
                    <div class="border rounded-lg p-3 text-sm font-medium
                        {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-800
                        {% else %}bg-green-50 border-green-200 text-green-800{% endif %}">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                <form method="POST" class="space-y-5">
                    {% csrf_token %}
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Usuario</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                            </div>
                            <input type="text" name="username" class="form-input w-full pl-10 pr-4 py-3 rounded-lg text-gray-900" placeholder="Username" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            </div>
                            <input type="password" name="password" class="form-input w-full pl-10 pr-4 py-3 rounded-lg text-gray-900" placeholder="Contraseña" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-dark w-full py-3 px-4 rounded-lg text-white font-semibold text-lg shadow-lg">
                        Iniciar Sesión
                    </button>
                </form>

            </div>
        </div>
    </main>
</div>
</body>
</html>
