{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Centro Médico - Healthy Life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .form-input { transition: all 0.3s; border: 2px solid #e5e7eb; }
        .form-input:focus { border-color: #1a1a2e; box-shadow: 0 0 0 3px rgba(26,26,46,0.1); outline: none; }
        .btn-dark { background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
        <span class="text-xl font-bold text-gray-900">Healthy Life <span class="text-sm font-normal text-gray-500">| Root</span></span>
        <a href="{% url 'dashboard_root' %}" class="text-sm text-gray-600 hover:text-gray-900 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Volver al dashboard
        </a>
    </div>
</nav>

<div class="max-w-xl mx-auto px-4 py-10">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-1">Registrar Centro Médico</h1>
        <p class="text-gray-500 text-sm mb-6">Los centros médicos agrupan múltiples sedes.</p>

        {% if messages %}
        <div class="mb-5 space-y-2">
            {% for message in messages %}
            <div class="border rounded-lg p-3 text-sm font-medium
                {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-800
                {% else %}bg-green-50 border-green-200 text-green-800{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre del Centro Médico <span class="text-red-500">*</span></label>
                <input type="text" name="nombre_cm" class="form-input w-full px-4 py-3 rounded-lg text-gray-900" placeholder="Ej: Clínica Norte" required>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">RIF</label>
                <input type="text" name="rif_cm" class="form-input w-full px-4 py-3 rounded-lg text-gray-900" placeholder="Ej: J-12345678-9">
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit" class="btn-dark flex-1 py-3 rounded-lg text-white font-semibold shadow-md hover:opacity-90 transition">
                    Registrar Centro Médico
                </button>
                <a href="{% url 'dashboard_root' %}" class="flex-1 py-3 rounded-lg border border-gray-300 text-gray-700 font-semibold text-center hover:bg-gray-50 transition">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
