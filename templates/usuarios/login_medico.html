{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Medicos - Healthy Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/homepage_redesign.css' %}">
    <style>
        .login-body { background: var(--bg-primary); min-height: 100vh; }
        .login-card { background: var(--bg-white); border: 1px solid rgba(0,0,0,0.04); border-radius: 16px; box-shadow: var(--shadow-card); padding: 2.5rem; }
        .login-card:hover { box-shadow: var(--shadow-hover); }
        .login-title { font-size: 1.75rem; font-weight: 700; color: var(--text-primary); }
        .login-subtitle { color: var(--text-secondary); font-size: 0.95rem; }
        .login-input-wrap { position: relative; }
        .login-input-wrap .hl-input { padding-left: 2.5rem; }
        .login-input-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94A3B8; pointer-events: none; }
        .login-btn { width: 100%; border-radius: 12px; padding: 0.85rem; font-weight: 600; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .login-link { color: var(--accent); font-weight: 600; font-size: 0.875rem; transition: color 0.2s ease; }
        .login-link:hover { color: var(--accent-hover); }
        .login-alt a { color: var(--text-secondary); font-size: 0.875rem; font-weight: 500; transition: color 0.2s ease; }
        .login-alt a:hover { color: var(--accent); }
        .login-divider { display: flex; align-items: center; gap: 1rem; color: #94A3B8; font-size: 0.8rem; margin: 1.5rem 0; }
        .login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: #E2E8F0; }
        .login-icon-wrap { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,112,243,0.08); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
        .login-alert { border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.875rem; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
        .login-alert-error { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); color: #DC2626; }
        .login-alert-success { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); color: #16A34A; }
        .login-alert-info { background: rgba(0,112,243,0.08); border: 1px solid rgba(0,112,243,0.2); color: var(--accent); }
        .login-header { background: linear-gradient(135deg, #0070F3, #005CC2); border-bottom: none; box-shadow: 0 4px 20px rgba(0,112,243,0.25); }
        .login-header a, .login-header span { color: #FFFFFF !important; }
        .login-header svg { color: #FFFFFF !important; }
        .login-body { position: relative; overflow-x: hidden; }
        .login-body::before { content: ''; position: fixed; top: -20%; right: -10%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0,112,243,0.06) 0%, transparent 70%); pointer-events: none; z-index: 0; }
        .login-body::after { content: ''; position: fixed; bottom: -10%; left: -5%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0,112,243,0.04) 0%, transparent 70%); pointer-events: none; z-index: 0; }
        .login-main { position: relative; z-index: 1; }
    </style>
</head>
<body class="login-body">
    <header class="login-header hl-header">
        <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="{% url 'home' %}" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #0070F3, #005CC2); border: 2px solid rgba(255,255,255,0.25);">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                    </svg>
                </div>
                <span class="text-xl font-bold tracking-tight" style="color:#FFFFFF;">Healthy Life</span>
            </a>
            <a href="{% url 'home' %}" class="flex items-center gap-1.5 text-sm font-medium" style="color:var(--text-secondary); transition:color .2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-secondary)'">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                Volver
            </a>
        </div>
    </header>

    <main class="login-main max-w-md mx-auto px-6 py-12">
        <div class="login-card hl-animate-fade-up">
            <div class="login-icon-wrap">
                <svg class="w-7 h-7" style="color:var(--accent);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
            </div>

            <div class="text-center mb-8">
                <h1 class="login-title">Acceso Medicos</h1>
                <p class="login-subtitle">Ingresa tus credenciales para continuar</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="login-alert {% if message.tags == 'error' %}login-alert-error{% elif message.tags == 'success' %}login-alert-success{% else %}login-alert-info{% endif %}">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            {% if message.tags == 'error' %}<path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            {% elif message.tags == 'success' %}<path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            {% else %}<path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            {% endif %}
                        </svg>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label for="username" class="block text-sm font-semibold mb-1.5" style="color:var(--text-primary);">Nombre de Usuario</label>
                    <div class="login-input-wrap">
                        <svg class="login-input-icon w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <input type="text" name="username" id="username" class="hl-input" placeholder="Tu nombre de usuario" required>
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold mb-1.5" style="color:var(--text-primary);">Contrasena</label>
                    <div class="login-input-wrap">
                        <svg class="login-input-icon w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <input type="password" name="password" id="password" class="hl-input" placeholder="Tu contrasena" required>
                    </div>
                </div>

                <button type="submit" class="hl-btn-primary login-btn">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
                    Iniciar Sesion
                </button>
            </form>

            <div class="login-divider">o</div>

            <div class="text-center space-y-3">
                <p class="text-sm" style="color:var(--text-secondary);">O accede como:</p>
                <div class="flex justify-center gap-4 login-alt">
                    <a href="{% url 'login_paciente' %}">Paciente</a>
                    <a href="{% url 'login_recepcionista' %}">Recepcionista</a>
                    <a href="{% url 'login_gerente' %}">Gerente</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
