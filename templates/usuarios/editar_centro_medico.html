{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Centro Médico - Healthy Life</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #F7F9FC; }
        .hl-card { background: #fff; border: 1px solid rgba(0,0,0,0.04); border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
        .hl-input { width: 100%; border-radius: 12px; border: 1px solid #E2E8F0; padding: 0.85rem 1rem; font-size: 0.95rem; color: #1E293B; background: #F8FAFC; transition: all 0.2s; outline: none; }
        .hl-input:focus { border-color: #0070F3; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(0,112,243,0.1); }
        .hl-btn-primary { background: linear-gradient(135deg, #0070F3, #005CC2); color: #FFFFFF; border-radius: 12px; padding: 0.85rem 1.5rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; border: none; cursor: pointer; transition: all 0.2s; }
        .hl-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,112,243,0.35); }
        .hl-btn-secondary { background: #fff; color: #64748B; border: 1px solid #E2E8F0; border-radius: 12px; padding: 0.85rem 1.5rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; transition: all 0.2s; }
        .hl-btn-secondary:hover { background: #F8FAFC; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="hl-card p-8">
            <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center mx-auto mb-4">
                    <svg class="w-7 h-7 text-[#0070F3]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Editar Centro Médico</h1>
                <p class="text-gray-500 text-sm mt-1">{{ centro.nombre_cm }}</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                <div class="mb-4 p-3 rounded-lg text-sm font-medium flex items-center gap-2
                    {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            {% endif %}

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Nombre del centro médico</label>
                    <input type="text" name="nombre_cm" class="hl-input" value="{{ centro.nombre_cm }}" maxlength="30" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">RIF</label>
                    <input type="text" name="rif_cm" class="hl-input" value="{{ centro.rif_cm|default:'' }}" placeholder="J-12345678-9">
                    <p class="text-xs text-gray-400 mt-1">Formato: J-12345678-9</p>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="hl-btn-primary flex-1 justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                        Guardar cambios
                    </button>
                    <a href="{% url 'dashboard_root' %}" class="hl-btn-secondary flex-1 justify-center">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
