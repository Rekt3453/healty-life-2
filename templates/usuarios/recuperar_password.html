{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contrasena - Healthy Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/homepage_redesign.css' %}">
    <style>
        .recover-body { background: var(--bg-primary); min-height: 100vh; }
        .recover-card { background: var(--bg-white); border: 1px solid rgba(0,0,0,0.04); border-radius: 16px; box-shadow: var(--shadow-card); padding: 2.5rem; }
        .recover-card:hover { box-shadow: var(--shadow-hover); }
        .recover-title { font-size: 1.75rem; font-weight: 700; color: var(--text-primary); }
        .recover-subtitle { color: var(--text-secondary); font-size: 0.95rem; }
        .recover-input-wrap { position: relative; }
        .recover-input-wrap .hl-input { padding-left: 2.5rem; }
        .recover-input-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94A3B8; pointer-events: none; }
        .recover-btn { width: 100%; border-radius: 12px; padding: 0.85rem; font-weight: 600; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .recover-link { color: var(--accent); font-weight: 600; font-size: 0.875rem; transition: color 0.2s ease; display: inline-flex; align-items: center; gap: 0.25rem; }
        .recover-link:hover { color: var(--accent-hover); }
        .recover-icon-wrap { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,112,243,0.08); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
        .recover-alert { border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.875rem; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
        .recover-alert-error { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); color: #DC2626; }
        .recover-alert-success { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); color: #16A34A; }
    </style>
</head>
<body class="recover-body">
    <header class="hl-header">
        <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="{% url 'home' %}" class="flex items-center gap-2 group">
                <svg class="w-7 h-7" style="color:var(--accent);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                <span class="text-lg font-bold" style="color:var(--text-primary);">Healthy Life</span>
            </a>
            <a href="{% url 'login_paciente' %}" class="flex items-center gap-1.5 text-sm font-medium" style="color:var(--text-secondary); transition:color .2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-secondary)'">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                Volver
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 py-12">
        <div class="recover-card hl-animate-fade-up">
            <div class="recover-icon-wrap">
                <svg class="w-7 h-7" style="color:var(--accent);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>

            <div class="text-center mb-8">
                <h1 class="recover-title">Recuperar Contrasena</h1>
                <p class="recover-subtitle">Ingresa tu correo para continuar</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="recover-alert {% if message.tags == 'error' %}recover-alert-error{% else %}recover-alert-success{% endif %}">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            {% if message.tags == 'error' %}<path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            {% else %}<path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            {% endif %}
                        </svg>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-semibold mb-1.5" style="color:var(--text-primary);">Correo electronico</label>
                    <div class="recover-input-wrap">
                        <svg class="recover-input-icon w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        <input type="email" name="correo" class="hl-input" placeholder="ejemplo@correo.com" required autofocus>
                    </div>
                </div>

                <button type="submit" class="hl-btn-primary recover-btn">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    Buscar cuenta
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{% url 'login_paciente' %}" class="recover-link">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                    Volver al inicio de sesion
                </a>
            </div>
        </div>
    </main>
</body>
</html>
