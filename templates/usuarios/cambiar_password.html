<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - Healthy Life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .hero-section { min-height: 100vh; background: linear-gradient(135deg, #064e3b 0%, #065f46 40%, #047857 100%); display: flex; align-items: center; justify-content: center; }
        .login-card { background: rgba(255,255,255,0.97); border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .form-input { transition: all 0.3s ease; border: 2px solid #e5e7eb; }
        .form-input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.1); outline: none; }
        .btn-primary { background: linear-gradient(135deg, #10b981 0%, #059669 100%); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(16,185,129,0.4); }
        .strength-bar { height: 4px; border-radius: 2px; transition: all 0.3s ease; }
    </style>
</head>
<body>
<div class="hero-section">
    <div class="w-full max-w-md px-4">

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white bg-opacity-20 rounded-full mb-4">
                <i class="fas fa-key text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">Nueva Contraseña</h1>
            <p class="text-green-200 mt-2">Paso 3 de 3 — Elige una contraseña segura</p>
        </div>

        <!-- Card -->
        <div class="login-card p-8">

            <!-- Mensajes -->
            {% if messages %}
                {% for message in messages %}
                <div class="mb-4 p-3 rounded-lg text-sm font-medium
                    {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200
                    {% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
                    <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% else %}fa-check-circle{% endif %} mr-2"></i>
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}

            <form method="POST" class="space-y-5" id="changeForm">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Nueva contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" name="password1" id="password1"
                               class="form-input w-full pl-10 pr-10 py-3 rounded-lg text-gray-900"
                               placeholder="Mínimo 8 caracteres" minlength="8" required autofocus>
                        <button type="button" onclick="togglePass('password1','eye1')"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye" id="eye1"></i>
                        </button>
                    </div>
                    <!-- Barra de fortaleza -->
                    <div class="mt-2 flex space-x-1">
                        <div class="strength-bar flex-1 bg-gray-200" id="s1"></div>
                        <div class="strength-bar flex-1 bg-gray-200" id="s2"></div>
                        <div class="strength-bar flex-1 bg-gray-200" id="s3"></div>
                        <div class="strength-bar flex-1 bg-gray-200" id="s4"></div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Confirmar contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" name="password2" id="password2"
                               class="form-input w-full pl-10 pr-10 py-3 rounded-lg text-gray-900"
                               placeholder="Repite la contraseña" minlength="8" required>
                        <button type="button" onclick="togglePass('password2','eye2')"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye" id="eye2"></i>
                        </button>
                    </div>
                    <p class="text-xs mt-1" id="matchMsg"></p>
                </div>

                <button type="submit" class="btn-primary w-full py-3 px-4 rounded-lg text-white font-semibold text-lg shadow-lg">
                    Cambiar contraseña
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function togglePass(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);
    if (input.type === 'password') { input.type = 'text'; eye.classList.replace('fa-eye','fa-eye-slash'); }
    else { input.type = 'password'; eye.classList.replace('fa-eye-slash','fa-eye'); }
}

const p1 = document.getElementById('password1');
const p2 = document.getElementById('password2');
const bars = ['s1','s2','s3','s4'].map(id => document.getElementById(id));
const colors = ['bg-red-400','bg-orange-400','bg-yellow-400','bg-green-500'];

p1.addEventListener('input', function() {
    const v = this.value;
    let score = 0;
    if (v.length >= 8) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    bars.forEach((b, i) => {
        b.className = 'strength-bar flex-1 ' + (i < score ? colors[score-1] : 'bg-gray-200');
    });
    checkMatch();
});

p2.addEventListener('input', checkMatch);

function checkMatch() {
    const msg = document.getElementById('matchMsg');
    if (!p2.value) { msg.textContent = ''; return; }
    if (p1.value === p2.value) {
        msg.textContent = '✓ Las contraseñas coinciden';
        msg.className = 'text-xs mt-1 text-green-600';
    } else {
        msg.textContent = '✗ Las contraseñas no coinciden';
        msg.className = 'text-xs mt-1 text-red-500';
    }
}
</script>
</body>
</html>
