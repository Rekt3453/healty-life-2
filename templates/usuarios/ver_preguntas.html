<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Preguntas de Seguridad - Healthy Life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f0fdf4; font-family: 'Segoe UI', system-ui, sans-serif; }
        .pregunta-card { border-left: 4px solid #10b981; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-lg">

    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-full mb-3">
            <i class="fas fa-check-shield text-green-600 text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Mis Preguntas de Seguridad</h1>
        <p class="text-gray-500 text-sm mt-1">Estas preguntas ya están configuradas y no se pueden cambiar</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-8">

        <div class="bg-green-50 border border-green-200 rounded-lg p-3 mb-6 text-sm text-green-800">
            <i class="fas fa-check-circle mr-2"></i>
            Tienes <strong>{{ preguntas|length }} preguntas</strong> de seguridad configuradas.
        </div>

        <div class="space-y-3">
            {% for pid, texto in preguntas %}
            <div class="pregunta-card bg-gray-50 rounded-lg p-4">
                <p class="text-sm font-medium text-gray-700">
                    <span class="inline-flex items-center justify-center w-6 h-6 bg-green-500 text-white rounded-full text-xs font-bold mr-2">{{ forloop.counter }}</span>
                    {{ texto }}
                </p>
            </div>
            {% endfor %}
        </div>

        <div class="mt-6 text-center">
            <a href="javascript:history.back()" class="text-sm text-green-600 hover:text-green-700 font-medium transition-colors">
                <i class="fas fa-arrow-left mr-1"></i> Volver
            </a>
        </div>
    </div>
</div>

</body>
</html>
